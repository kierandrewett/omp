name: Release

# A tag that starts with v builds omp for amd64 and arm64, packs each build with pkgsmith, and publishes a GitHub release
# that holds the binaries, every package and SHA256SUMS.txt. `omp update` reads the raw binaries and the checksum file
# of the latest release, so those stay in every release next to the packages.
#
# The tag must equal the release this checkout describes: the pinned upstream tag plus the `revision` file, for example
# v18.14.2-fork.2 (see scripts/release-info.sh). Raise `revision` first, commit, then push the tag.
#
# Run it by hand from the Actions tab for a dry run. A dry run builds everything, checks the packages in containers and
# uploads the files as workflow artifacts. It never creates a release or a tag, even when it runs on a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  info:
    runs-on: ubuntu-24.04
    outputs:
      fork_tag: ${{ steps.info.outputs.fork_tag }}
      upstream_tag: ${{ steps.info.outputs.upstream_tag }}
      version: ${{ steps.info.outputs.version }}
      revision: ${{ steps.info.outputs.revision }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Work out the release
        id: info
        run: scripts/release-info.sh | tee -a "$GITHUB_OUTPUT"
      - name: Decide between a release and a dry run
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_TAG: ${{ steps.info.outputs.fork_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
              if [ "$GITHUB_REF_NAME" != "$FORK_TAG" ]; then
                  echo "::error::The tag is $GITHUB_REF_NAME but this commit describes $FORK_TAG. Fix the revision file or the tag."
                  exit 1
              fi
              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$FORK_TAG" >/dev/null 2>&1; then
                  echo "::error::A release for $FORK_TAG already exists. Raise the revision file and use a new tag."
                  exit 1
              fi
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "Publishing $FORK_TAG"
          else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Dry run for $FORK_TAG. Nothing is published."
          fi

  # The addons for both architectures are built here, on x64, with Bazel's hermetic toolchains. That is how upstream
  # builds them, and it keeps the glibc floor low enough for older distros. A Cargo build on a runner would link to the
  # runner's newer glibc. The arm64 addon is a cross build.
  natives:
    needs: info
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Build the addons
        env:
          NATIVES: bazel
          NATIVES_TARGETS: linux-x64-baseline linux-x64-modern linux-arm64
          NATIVES_ONLY: ${{ github.workspace }}/natives
        run: |
          set -euo pipefail
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          scripts/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: natives
          path: natives/*.node
          if-no-files-found: error
          retention-days: 1

  # Each architecture builds, packs and checks its own binary on a runner of that architecture, so the arm64 binary and
  # its packages run on arm64 before they are published.
  package:
    needs: [info, natives]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, binary: omp-linux-x64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, binary: omp-linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: natives
          path: natives
      - name: Build omp
        env:
          NATIVES: prebuilt
          NATIVES_DIR: ${{ github.workspace }}/natives
        run: scripts/build.sh
      - name: Install omp into the prefix
        run: scripts/install-prefix.sh
      # pkgsmith is built from the commit pinned in scripts/pkgsmith-commit. The runner image has Rust, but update it
      # so a stale image cannot fail the build.
      - name: Write the packages
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          scripts/package.sh plan
          scripts/package.sh build
      - name: Install each package in a container of its distro
        run: scripts/smoke-packages.sh
      - name: Collect the files
        run: |
          set -euo pipefail
          mkdir upload
          cp "dist/${{ matrix.binary }}" dist/packages/* upload/
          ls -l upload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: files-${{ matrix.arch }}
          path: upload/*
          if-no-files-found: error
          retention-days: 7

  # Checksums for every file of the release. This runs on a dry run too, so the file that would be published is the
  # file that was checked.
  collect:
    needs: [info, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: files-*
          merge-multiple: true
          path: release
      - name: Write SHA256SUMS.txt
        env:
          FORK_TAG: ${{ needs.info.outputs.fork_tag }}
          PUBLISH: ${{ needs.info.outputs.publish }}
        run: |
          set -euo pipefail
          cd release
          # omp update looks for the line "<hash>  omp-linux-<arch>", so both raw binaries must be listed.
          for binary in omp-linux-x64 omp-linux-arm64; do test -s "$binary"; done
          sha256sum -- * > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          {
              echo "## $FORK_TAG ($([ "$PUBLISH" = true ] && echo release || echo dry run, nothing published))"
              echo
              echo '```text'
              cat SHA256SUMS.txt
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release/*
          if-no-files-found: error
          retention-days: 7

  # Only a pushed v* tag gets here. A manual run is always a dry run, whatever ref it runs on.
  publish:
    needs: [info, collect]
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.info.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - name: Publish the release with every file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FORK_TAG: ${{ needs.info.outputs.fork_tag }}
          UPSTREAM_TAG: ${{ needs.info.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$FORK_TAG"
          cd release
          sha256sum --check SHA256SUMS.txt
          # A draft first, so nobody sees a release with a missing file.
          gh release create "$FORK_TAG" ./* --draft --title "$FORK_TAG" \
              --notes "Patched build of can1357/oh-my-pi $UPSTREAM_TAG for amd64 and arm64: the raw binaries (omp update reads these), and rpm, deb, Arch and tar packages. Checksums are in SHA256SUMS.txt. Patches and build scripts: $GITHUB_SHA."
          gh release edit "$FORK_TAG" --draft=false --latest
